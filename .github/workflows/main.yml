name: Deploy to EC2

on:
  push:
    branches:
      - staging
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed so git diff HEAD~1 works

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/lms-be
            git pull origin staging
            npm install

            # Rebuild workspace Docker images only when Dockerfiles change
            if git diff HEAD~1 --name-only 2>/dev/null | grep -q '^backend/docker/'; then
              echo "Dockerfiles changed — rebuilding workspace images..."
              docker build -t workspace-node  ./docker/workspace-node
              docker build -t workspace-python ./docker/workspace-python
              docker build -t workspace-java   ./docker/workspace-java
              docker build -t workspace-sql    ./docker/workspace-sql
            fi

            pm2 restart lms-be --update-env
