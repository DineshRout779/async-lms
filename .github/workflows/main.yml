name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - staging
          - production
      deploy_orchestrator:
        description: 'Deploy Orchestrator'
        required: true
        type: boolean
        default: true
      deploy_workers:
        description: 'Deploy Workers'
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend'
        required: true
        type: boolean
        default: true

jobs:
  # ── Orchestrator → EC2 (t3.small) ─────────────────────────────────────────────
  deploy-orchestrator:
    if: github.event.inputs.deploy_orchestrator == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Orchestrator to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/lms-be
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cd backend

            # Generate .env file automatically
            echo "PGHOST=${{ secrets.PGHOST }}" > .env
            echo "PGDATABASE=${{ secrets.PGDATABASE }}" >> .env
            echo "PGUSER=${{ secrets.PGUSER }}" >> .env
            echo "PGPASSWORD='${{ secrets.PGPASSWORD }}'" >> .env
            echo "PGPORT=${{ secrets.PGPORT }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
            echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env
            echo "S3_WORKSPACE_BUCKET=${{ secrets.S3_WORKSPACE_BUCKET }}" >> .env
            echo "GOOGLE_AUTH_CLIENT_ID=${{ secrets.GOOGLE_AUTH_CLIENT_ID }}" >> .env
            echo "GOOGLE_AUTH_CLIENT_SECRET=${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}" >> .env
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
            echo "ORCHESTRATOR_URL=${{ secrets.ORCHESTRATOR_URL }}" >> .env
            echo "WORKER_CAPACITY=${{ secrets.WORKER_CAPACITY }}" >> .env
            echo "MAX_WORKSPACES=${{ secrets.MAX_WORKSPACES }}" >> .env
            echo "CHATGPT_API_KEY=${{ secrets.CHATGPT_API_KEY }}" >> .env
            echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
            echo "PORT=3001" >> .env

            npm install
            
            # Restart ONLY the orchestrator process via ecosystem.config.js
            pm2 start ecosystem.config.js --only orchestrator || pm2 restart orchestrator --update-env

  # ── Workers → staging: 1x EC2 (t3.medium/4GB) | production: 5x EC2 (t3.large/8GB) ──
  deploy-workers:
    if: github.event.inputs.deploy_workers == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Debug Worker IP
        run: |
          IP="${{ secrets.WORKER_IPS }}"
          echo "IP suffix: ${IP: -10}"
      - name: Deploy to Worker Node(s)
        uses: appleboy/ssh-action@v1.0.3
        with:
          # staging environment secret → single IP (4GB t3.medium)
          # production environment secret → 5 comma-separated IPs (8GB t3.large)
          host: ${{ secrets.WORKER_IPS }}
          username: ubuntu
          key: ${{ secrets.WORKER_SSH_KEY }}
          script: |
            # Self-healing Swap Setup (Ensures 10GB swap exists for Docker stability)
            if [ ! -f /swapfile ]; then
              echo "No swapfile found. Provisioning 10GB swap space..."
              sudo fallocate -l 10G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            else
              if ! swapon --show | grep -q '/swapfile'; then
                sudo swapon /swapfile
              fi
            fi

            cd /home/ubuntu/lms-be
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cd backend

            # Generate .env file automatically with Dynamic IP Detection
            PUBLIC_IP=$(curl -s ifconfig.me)
            echo "WORKER_PORT=4000" > .env
            echo "WORKER_ID=worker-$(hostname)" >> .env
            echo "WORKER_URL=http://$PUBLIC_IP:4000" >> .env
            echo "ORCHESTRATOR_URL=${{ secrets.ORCHESTRATOR_URL }}" >> .env
            echo "PGHOST=${{ secrets.PGHOST }}" >> .env
            echo "PGDATABASE=${{ secrets.PGDATABASE }}" >> .env
            echo "PGUSER=${{ secrets.PGUSER }}" >> .env
            echo "PGPASSWORD='${{ secrets.PGPASSWORD }}'" >> .env
            echo "PGPORT=${{ secrets.PGPORT }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
            echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env
            echo "GOOGLE_AUTH_CLIENT_ID=${{ secrets.GOOGLE_AUTH_CLIENT_ID }}" >> .env
            echo "GOOGLE_AUTH_CLIENT_SECRET=${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}" >> .env
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
            echo "CHATGPT_API_KEY=${{ secrets.CHATGPT_API_KEY }}" >> .env
            echo "WORKER_CAPACITY=${{ secrets.WORKER_CAPACITY }}" >> .env
            echo "MAX_WORKSPACES=${{ secrets.MAX_WORKSPACES }}" >> .env
            echo "S3_WORKSPACE_BUCKET=${{ secrets.S3_WORKSPACE_BUCKET }}" >> .env
            
            # Install build tools for native modules like node-pty
            sudo apt-get update -y
            sudo apt-get install -y build-essential python3

            npm install

            echo "Rebuilding workspace images (uses cache if unchanged)..."
            docker build -t workspace-node   ./docker/workspace-node
            docker build -t workspace-python ./docker/workspace-python
            docker build -t workspace-java   ./docker/workspace-java
            docker build -t workspace-sql    ./docker/workspace-sql

            # Fix permissions of existing workspaces that Docker accidentally created as root
            sudo chown -R ubuntu:ubuntu /home/ubuntu/lms-be/backend/workspaces || true

            # Restart ONLY the worker process via ecosystem.config.js
            pm2 start ecosystem.config.js --only worker || pm2 restart worker --update-env

  # ── Frontend → S3 + CloudFront ───────────────────────────────────────────────
  deploy-frontend:
    if: github.event.inputs.deploy_frontend == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Upload to S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - run: aws s3 sync frontend/dist s3://${{ secrets.S3_FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
