name: Deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  # ── Backend → EC2 ────────────────────────────────────────────────────────────
  deploy-backend:
    if: >
      contains(github.event.commits[0].modified, 'backend/') ||
      contains(github.event.commits[0].added,    'backend/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed so git diff HEAD~1 works

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/lms-be
            git pull origin staging
            cd backend
            npm install

            # Rebuild workspace Docker images only when Dockerfiles change
            if git diff HEAD~1 --name-only 2>/dev/null | grep -q '^backend/docker/'; then
              echo "Dockerfiles changed — rebuilding workspace images..."
              docker build -t workspace-node   ./docker/workspace-node
              docker build -t workspace-python ./docker/workspace-python
              docker build -t workspace-java   ./docker/workspace-java
              docker build -t workspace-sql    ./docker/workspace-sql
            fi

            pm2 restart lms-be --update-env

  # ── Frontend → S3 + CloudFront ───────────────────────────────────────────────
  deploy-frontend:
    if: >
      contains(github.event.commits[0].modified, 'frontend/') ||
      contains(github.event.commits[0].added,    'frontend/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Upload to S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - run: aws s3 sync frontend/dist s3://${{ secrets.S3_FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
